# Google Play release for the JoyoArto app (apps/mobile): signed AAB, optional upload to a Play track.
# Manual only (Actions -> "Release Android" -> Run workflow), on GitHub's runners, never the laptop:
#   gh workflow run release-android.yml -R dzulfikar08/joyoarto -f play_track=internal -f play_status=completed
#   gh workflow run release-android.yml -R dzulfikar08/joyoarto -f play_track=none        # artifact only
# Secrets live in the `release` environment (main only): ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
# ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD (backup: secrets/joyoarto-keystore.tar.gpg, passphrase on the Linux box in
# ~/.config/joyoarto/keystore-backup-passphrase) and PLAY_SERVICE_ACCOUNT_JSON (JoyoRogo's Play service account).
# A brand-new Play app needs its first AAB uploaded by hand in Play Console; after that this workflow can upload.
name: Release Android

on:
  workflow_dispatch:
    inputs:
      play_track:
        description: "Upload the AAB to this Play track (none = artifact only)"
        type: choice
        options: [none, internal, alpha, beta]
        default: internal
      play_status:
        description: "Release status (draft = finish it in Play Console)"
        type: choice
        options: [completed, draft]
        default: completed

permissions:
  contents: read

concurrency:
  group: release-android
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: release
    env:
      VARIANT: play
      # Phones only: 64-bit and 32-bit ARM.
      ARCHS: arm64-v8a,armeabi-v7a
      HAS_KEYSTORE: "true"
      PLAY_TRACK: ${{ inputs.play_track }}
      PLAY_STATUS: ${{ inputs.play_status }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/node_modules/.cache "$AGENT_TOOLSDIRECTORY/CodeQL"

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      # CVE-2026-91403 (as in JoyoRogo): Gradle fetches over TLS with a JDK that may still trust the compromised
      # eMudhra intermediates, so the JVMs use a copy of cacerts without them. Drop once the pinned JDK is fixed.
      - name: Distrust eMudhra in the JDK (CVE-2026-91403)
        run: |
          store="$RUNNER_TEMP/cacerts"
          cp -L "$JAVA_HOME/lib/security/cacerts" "$store" && chmod 600 "$store"
          for alias in $("$JAVA_HOME/bin/keytool" -list -keystore "$store" -storepass changeit | grep -i emsign | cut -d, -f1); do
            "$JAVA_HOME/bin/keytool" -delete -keystore "$store" -storepass changeit -alias "$alias"
          done
          if "$JAVA_HOME/bin/keytool" -list -keystore "$store" -storepass changeit | grep -qi emsign; then echo "emSign still trusted" >&2; exit 1; fi
          echo "JAVA_TOOL_OPTIONS=-Djavax.net.ssl.trustStore=$store -Djavax.net.ssl.trustStorePassword=changeit" >> "$GITHUB_ENV"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Cache bun packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: false

      - name: Gradle JVM settings
        run: |
          mkdir -p ~/.gradle
          cat >> ~/.gradle/gradle.properties <<'EOF2'
          org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC
          org.gradle.parallel=true
          org.gradle.caching=true
          EOF2

      # ubuntu-latest ships the Android SDK (ANDROID_HOME is set); Gradle fetches missing platforms/build-tools.
      - name: Android SDK
        run: test -d "$ANDROID_HOME" && echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME/build-tools"

      # Most of a cold build is C++ from native libraries (unistyles, reanimated, worklets…), which Gradle's build
      # cache does not cover. ccache keeps the compiled objects between runs; CMake picks it up from the
      # CMAKE_*_COMPILER_LAUNCHER environment variables, which the NDK's CMake inherits from Gradle.
      - name: Install ccache
        run: sudo apt-get install -y -qq ccache >/dev/null && ccache --version | head -1
      - name: Cache ccache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ccache
          key: ccache-android-play-${{ hashFiles('bun.lock') }}-${{ github.sha }}
          restore-keys: |
            ccache-android-play-${{ hashFiles('bun.lock') }}-
            ccache-android-play-
      - name: Use ccache for native code
        run: |
          {
            echo "CCACHE_DIR=$HOME/.cache/ccache"
            echo "CCACHE_MAXSIZE=2G"
            echo "CCACHE_COMPILERCHECK=content"
            # Paths differ per checkout; let ccache match on relative paths.
            echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE"
            echo "CCACHE_NOHASHDIR=true"
            echo "CMAKE_C_COMPILER_LAUNCHER=ccache"
            echo "CMAKE_CXX_COMPILER_LAUNCHER=ccache"
          } >> "$GITHUB_ENV"
          ccache --zero-stats

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck and unit tests
        working-directory: apps/mobile
        run: |
          bunx tsc --noEmit
          bun test ./src/

      - name: Restore release keystore (optional)
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/keystore"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keystore/joyoarto-release.jks"
          {
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/keystore/joyoarto-release.jks"
            echo "ANDROID_KEYSTORE_PASSWORD=$STORE_PASSWORD"
            echo "ANDROID_KEY_ALIAS=$KEY_ALIAS"
            echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build APK
        run: apps/mobile/scripts/build-android-ci.sh

      - name: ccache stats
        if: always()
        run: ccache --show-stats | tee -a "$GITHUB_STEP_SUMMARY" || true

      - name: Checksum
        run: sha256sum dist/joyoarto-play-*.aab | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload AAB artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: joyoarto-play-${{ github.run_number }}
          path: |
            dist/joyoarto-play-*.aab
            dist/mapping-play.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload to Google Play
        if: env.PLAY_TRACK != 'none'
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.joyodigitama.joyoarto
          releaseFiles: dist/joyoarto-play-*.aab
          track: ${{ env.PLAY_TRACK }}
          status: ${{ env.PLAY_STATUS }}

      - name: Remove signing material
        if: always()
        run: rm -rf "$RUNNER_TEMP/keystore"
