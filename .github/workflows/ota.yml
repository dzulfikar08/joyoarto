# Over-the-air JS update for the JoyoArto phone app (EAS Update): runs apps/mobile/scripts/ota.sh.
# Policy, rollback and the one-time setup: docs/ota.md.
#
# Manual only (Actions -> "OTA update" -> Run workflow):
#   gh workflow run ota.yml -R dzulfikar08/joyoarto -f message="Fix the dashboard total"
#   gh workflow run ota.yml -R dzulfikar08/joyoarto -f message="Try it" -f channel=preview
# The job is bound to the `release` environment, which holds EXPO_TOKEN (an Expo access token of the owner), needs the
# owner's approval and is limited to the default branch. Nothing is uploaded to a store.
#
# JS and asset changes only: anything that touches native code or native config changes the fingerprint
# runtimeVersion, and the update would then reach nobody. See docs/ota.md "When OTA is not enough".
name: OTA update

on:
  workflow_dispatch:
    inputs:
      message:
        description: "Update message (shows in the EAS dashboard and `eas update:list`)"
        type: string
        required: true
      channel:
        description: "production = Play and TestFlight builds; preview = the sideload APK (android.yml)"
        type: choice
        options: [production, preview]
        default: production
      platform:
        description: "Platform to publish (preview is Android only)"
        type: choice
        options: [all, android, ios]
        default: all
      android_runtime:
        description: "Optional: runtimeVersion (or its first 8 characters) of the installed Android build, to warn on a mismatch"
        type: string
        default: ""
      ios_runtime:
        description: "Optional: runtimeVersion (or its first 8 characters) of the installed iOS build, to warn on a mismatch"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: ota-${{ inputs.channel }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      CHANNEL: ${{ inputs.channel }}
      PLATFORM: ${{ inputs.platform }}
      MESSAGE: ${{ inputs.message }}
      EXPECT_RUNTIME_ANDROID: ${{ inputs.android_runtime }}
      EXPECT_RUNTIME_IOS: ${{ inputs.ios_runtime }}
      # Same as release-ios.yml passes to the iOS build: part of the config, so part of the fingerprint.
      JOYOARTO_GOOGLE_IOS_CLIENT_ID: ${{ vars.JOYOARTO_GOOGLE_IOS_CLIENT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Cache bun packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check the token is there
        run: '[ -n "$EXPO_TOKEN" ] || { echo "EXPO_TOKEN is not set in the release environment (docs/ota.md, One-time setup)" >&2; exit 1; }'

      - name: Publish
        run: apps/mobile/scripts/ota.sh --channel "$CHANNEL" --platform "$PLATFORM" -- "$MESSAGE" | tee -a "$GITHUB_STEP_SUMMARY"
