# Checks for pull requests and pushes to main: typecheck, build, tests, lint. No secrets.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, build, test, lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      # routeTree.gen.ts is generated by the vite router plugin, so the web build runs before its typecheck.
      - name: Web build, then typecheck
        working-directory: apps/web
        run: |
          bunx vite build
          bunx tsc --noEmit
          bunx tsc --noEmit -p tsconfig.scripts.json
      - name: Packages and server typecheck
        run: |
          for p in packages/api packages/db packages/auth packages/ui apps/server; do echo "== $p"; (cd $p && bunx tsc --noEmit); done
      - name: Tests
        run: |
          (cd packages/api && bun test src)
          (cd packages/auth && bun test src)
          (cd apps/web && bun test src)
          (cd apps/server && bun test src)
      - name: Lint
        run: bunx oxlint
