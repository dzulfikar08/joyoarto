# iOS App Store build for the JoyoArto app (apps/mobile) on a GitHub macOS runner, the same pipeline as JoyoRogo's
# release-ios.yml: expo prebuild, pods, xcodebuild archive + export, IPA checks (apps/mobile/scripts/ios/build-ios.sh),
# optional TestFlight upload. Never on the laptop.
#
# Manual only (Actions -> "Release iOS" -> Run workflow), bound to the `release` environment (owner approval, main
# only), which holds the App Store Connect API key and the distribution certificate:
#   gh workflow run release-ios.yml -R dzulfikar08/joyoarto -f upload_testflight=false   # IPA artifact only
#   gh workflow run release-ios.yml -R dzulfikar08/joyoarto -f upload_testflight=true    # ...and to TestFlight
# Setup and the secrets' sources: docs/ios-release.md.
#
# Signing (as JoyoRogo, same Apple team F6Q6UFUK69 and the same API key): the Apple Distribution identity comes from the
# IOS_DIST_CERT_* .p12 in a temporary keychain, the App Store profile "joyo-ci com.joyodigitama.joyoarto <cert id>" is
# fetched (or created) through the API by asc-ci-profile.py, and archive and export both sign manually with them.
#
# BUILD_NUMBER is left to the script: YYYYMMDDHHMM in UTC, like JoyoRogo. Nothing is uploaded unless upload_testflight
# is ticked.
name: Release iOS

on:
  workflow_dispatch:
    inputs:
      upload_testflight:
        description: "Upload the IPA to App Store Connect (TestFlight)"
        type: boolean
        default: false
      xcode_version:
        description: "Xcode version (semver range for maxim-lobanov/setup-xcode, e.g. 26.x or latest-stable)"
        type: string
        default: latest-stable

permissions:
  contents: read

concurrency:
  group: release-ios
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 120
    environment: release
    env:
      UPLOAD: ${{ inputs.upload_testflight && '1' || '0' }}
      XCODE_VERSION: ${{ inputs.xcode_version || 'latest-stable' }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Cache bun and CocoaPods downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.bun/install/cache
            ~/Library/Caches/CocoaPods
          key: ios-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: ios-${{ runner.os }}-

      - name: Check the secrets are set
        env:
          ASC_KEY_BASE64: ${{ secrets.ASC_KEY_BASE64 }}
          P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
        run: |
          missing=""
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_BASE64 P12_BASE64 P12_PASSWORD; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          [ -z "$missing" ] || { echo "::error::release environment secrets missing:$missing (docs/ios-release.md)"; exit 1; }

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck and unit tests
        working-directory: apps/mobile
        run: |
          bunx tsc --noEmit
          bun test ./src/

      # altool and the script read the key from ~/.appstoreconnect/private_keys (mode 600).
      - name: Install App Store Connect API key
        env:
          ASC_KEY_BASE64: ${{ secrets.ASC_KEY_BASE64 }}
        run: |
          umask 077
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s' "$ASC_KEY_BASE64" | base64 --decode > ~/.appstoreconnect/private_keys/"AuthKey_${ASC_KEY_ID}.p8"
          chmod 600 ~/.appstoreconnect/private_keys/"AuthKey_${ASC_KEY_ID}.p8"
          echo "ASC_KEY_PATH=$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8" >> "$GITHUB_ENV"

      # Automatic export needs a cloud-managed distribution certificate, which the API key may not create (JoyoRogo:
      # "Cloud signing permission error"; the team already holds Apple's maximum of three Apple Distribution
      # certificates). So the identity comes from the .p12 and the App Store profile from the API.
      - name: Import distribution certificate and fetch the App Store profile
        env:
          P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
        run: |
          kc="$RUNNER_TEMP/release.keychain-db"
          kcpass="$(uuidgen)"
          printf '%s' "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security create-keychain -p "$kcpass" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kcpass" "$kc"
          security import "$RUNNER_TEMP/dist.p12" -k "$kc" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kcpass" "$kc" > /dev/null
          # shellcheck disable=SC2046 # one word per existing keychain path
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/dist.p12"
          security find-identity -v -p codesigning "$kc" | sed 's/^ *[0-9]*) [0-9A-F]* //'
          serial="$(security find-certificate -a -c 'Apple Distribution' -p "$kc" | openssl x509 -noout -serial | cut -d= -f2 | head -1)"
          mkdir -p "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          # One capability: Sign in with Apple (APPLE_ID_AUTH; the app's com.apple.developer.applesignin entitlement,
          # docs/mobile-auth.md). No App Group, push or extension (docs/ios-release.md). The script registers the bundle
          # id if it is missing and enables the capability (which invalidates the old profile; it makes a new one).
          out="$(python3 apps/mobile/scripts/ios/asc-ci-profile.py com.joyodigitama.joyoarto "$serial" "$RUNNER_TEMP/store.mobileprovision" APPLE_ID_AUTH)"
          uuid="$(cut -f1 <<<"$out")"
          cp "$RUNNER_TEMP/store.mobileprovision" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/$uuid.mobileprovision"
          echo "EXPORT_PROFILE=$(cut -f2 <<<"$out")" >> "$GITHUB_ENV"

      - name: Build IPA
        env:
          # Optional: the iOS OAuth client id for native Google Sign-In (a public value; app.json extra.googleIosClientId
          # works too). Unset and not in app.json = the iPhone app shows Sign in with Apple and tokens only.
          JOYOARTO_GOOGLE_IOS_CLIENT_ID: ${{ vars.JOYOARTO_GOOGLE_IOS_CLIENT_ID }}
        run: |
          if [ "$UPLOAD" = 1 ]; then
            apps/mobile/scripts/ios/build-ios.sh --upload
          else
            apps/mobile/scripts/ios/build-ios.sh
          fi

      - name: Checksum
        run: shasum -a 256 dist/ios/JoyoArto.ipa | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: joyoarto-ios-${{ github.run_number }}
          path: dist/ios/JoyoArto.ipa
          if-no-files-found: error
          retention-days: 30

      # Logs, the merged privacy manifest and the signing plists; no secrets (the key is only passed as a path).
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: joyoarto-ios-logs-${{ github.run_number }}
          path: |
            dist/ios/*.log
            dist/ios/*.plist
            dist/ios/PrivacyInfo.xcprivacy
          if-no-files-found: ignore
          retention-days: 7

      - name: Remove signing material
        if: always()
        run: |
          rm -f ~/.appstoreconnect/private_keys/AuthKey_*.p8
          security delete-keychain "$RUNNER_TEMP/release.keychain-db" 2>/dev/null || true
