<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- seo:head -->
    <!-- Replaced per public page at build time (scripts/prerender.ts, copy in src/lib/seo.ts); this is what dev shows. -->
    <title>JoyoArto</title>
    <meta name="description" content="Aplikasi keuangan keluarga open source: e-statement Bank Jago & GoPay, setiap saldo dicek sampai cocok." />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <!-- /seo:head -->
    <meta name="theme-color" content="#f9f6f1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#110f0b" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="JoyoArto" />
    <meta name="application-name" content="JoyoArto" />
    <!-- Hosts: arto.joyorogo.com shows the public pages, app.arto.joyorogo.com the app; the old baroka.by.dzulfikar.com
         sends everything to the app host. Same rules as src/lib/hosts.ts (this copy runs before the bundle loads).
         Only the public site is indexed: every other host gets robots noindex here (and X-Robots-Tag from public/_headers).
         The "js" class hides the prerendered #prerender body for people who run the app (see scripts/prerender.ts). -->
    <script>
      (function () {
        var d = document.documentElement, h = location.hostname, p = location.pathname, pub = ["/", "/demo", "/pricing", "/claude", "/privasi", "/syarat"];
        d.className += " js";
        if (h !== "arto.joyorogo.com") document.querySelector('meta[name="robots"]').setAttribute("content", "noindex");
        if (h === "baroka.by.dzulfikar.com" || (h === "arto.joyorogo.com" && pub.indexOf(p.replace(/\/$/, "") || "/") < 0))
          location.replace("https://app.arto.joyorogo.com" + p + location.search + location.hash);
      })();
    </script>
    <!-- RevKlik visitor stats on the public site only (arto.joyorogo.com), never in the app: it shares JoyoRogo's site so
         visits from landing to Joyo Pro checkout on joyorogo.com read as one funnel. Disclosed in /privasi. -->
    <script>
      if (location.hostname === "arto.joyorogo.com") {
        var rk = document.createElement("script");
        rk.defer = true;
        rk.src = "https://app.revklik.com/klikapa.js";
        rk.setAttribute("data-site-id", "88069ee9-6eac-4dc9-a23b-f5757a4b948e");
        document.head.appendChild(rk);
      }
    </script>
    <!-- Theme before first paint; matches @baroka/ui use-theme (class + colorScheme, key "baroka.theme"). -->
    <script>
      try {
        var t = localStorage.getItem("baroka.theme") || "system";
        var dark = t === "dark" || (t === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
      } catch (e) {}
    </script>
    <style>
      .js #prerender { display: none; }
      #prerender { max-width: 46rem; margin: 0 auto; padding: 1.5rem 1rem; line-height: 1.6; }
      #prerender h1 { font-size: 2rem; line-height: 1.15; font-weight: 800; margin: 1.5rem 0 0.75rem; }
      #prerender h2 { font-size: 1.375rem; font-weight: 800; margin: 2rem 0 0.5rem; }
      #prerender h3 { font-weight: 700; margin: 1rem 0 0.25rem; }
      #prerender p, #prerender ol { margin: 0.5rem 0; }
      #prerender ol { padding-left: 1.25rem; list-style: decimal; }
      #prerender a { text-decoration: underline; }
      #prerender footer { margin-top: 2.5rem; font-size: 0.875rem; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
