<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f9f6f1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#110f0b" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="JoyoArto" />
    <meta name="application-name" content="JoyoArto" />
    <!-- Hosts: arto.joyorogo.com shows the public pages, app.arto.joyorogo.com the app; the old baroka.by.dzulfikar.com
         sends everything to the app host. Same rules as src/lib/hosts.ts (this copy runs before the bundle loads). -->
    <script>
      (function () {
        var h = location.hostname, p = location.pathname, pub = ["/", "/demo", "/privasi", "/syarat"];
        if (h === "baroka.by.dzulfikar.com" || (h === "arto.joyorogo.com" && pub.indexOf(p.replace(/\/$/, "") || "/") < 0))
          location.replace("https://app.arto.joyorogo.com" + p + location.search + location.hash);
      })();
    </script>
    <!-- Theme before first paint; matches @baroka/ui use-theme (class + colorScheme, key "baroka.theme"). -->
    <script>
      try {
        var t = localStorage.getItem("baroka.theme") || "system";
        var dark = t === "dark" || (t === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
      } catch (e) {}
    </script>
    <title>JoyoArto · Keuangan keluarga rapi dari e-statement Jago & GoPay</title>
    <meta
      name="description"
      content="Upload e-statement Bank Jago dan GoPay, JoyoArto cek setiap saldo sampai cocok, lalu tanya Claude soal uangmu atau simulasikan rencana besar. Untuk keluarga. Family finance ledger for Indonesia: verified Jago & GoPay statements, Claude connector, plans."
    />
    <!-- %VITE_PUBLIC_URL% is the public origin (apps/web/.env.production; defaults to the current deployment). -->
    <link rel="canonical" href="%VITE_PUBLIC_URL%/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="JoyoArto" />
    <meta property="og:url" content="%VITE_PUBLIC_URL%/" />
    <meta property="og:title" content="JoyoArto · Keuangan keluarga rapi, tanpa nyatet satu-satu" />
    <meta
      property="og:description"
      content="Upload e-statement Jago & GoPay, setiap saldo dicek sampai cocok. Tanya Claude, ajak pasangan, simulasikan rencana. Coba demonya tanpa akun."
    />
    <meta property="og:image" content="%VITE_PUBLIC_URL%/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="JoyoArto: keuangan keluarga rapi dari e-statement Jago & GoPay" />
    <meta property="og:locale" content="id_ID" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="JoyoArto · Keuangan keluarga rapi, tanpa nyatet satu-satu" />
    <meta name="twitter:description" content="Upload e-statement Jago & GoPay, setiap saldo dicek sampai cocok. Tanya Claude soal uangmu." />
    <meta name="twitter:image" content="%VITE_PUBLIC_URL%/og.png" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
