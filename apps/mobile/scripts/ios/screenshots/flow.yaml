# App Store screenshots of the iPhone app, from the demo household (made-up data, reset daily). Run by
# .github/workflows/ios-screenshots.yml on a 6.9" simulator; DEMO_CODE comes from the workflow's secret.
appId: com.joyodigitama.joyoarto
---
- launchApp:
    clearState: true
    clearKeychain: true
# A cold first launch (fonts, the update check) can take a while on a CI simulator.
- extendedWaitUntil:
    visible: "Coba demo / Reviewer"
    timeout: 180000
- tapOn: "Coba demo / Reviewer"
# The field under the "Kode demo / Demo code" label (tapping the label does not focus it).
- tapOn:
    below: "Kode demo / Demo code"
    index: 0
- inputText: ${DEMO_CODE}
- hideKeyboard
- tapOn: "Masuk ke demo / Open the demo"
- extendedWaitUntil:
    visible: "Transactions"
    timeout: 60000
# Let the dashboard's queries and charts settle.
- waitForAnimationToEnd:
    timeout: 15000
- takeScreenshot: 01-home

- tapOn: "Transactions"
- waitForAnimationToEnd:
    timeout: 15000
- takeScreenshot: 02-transactions

- openLink: joyoarto://accounts
- runFlow:
    when:
      visible: "Open"
    commands:
      - tapOn: "Open"
- waitForAnimationToEnd:
    timeout: 15000
- takeScreenshot: 03-accounts

- openLink: joyoarto://plan
- runFlow:
    when:
      visible: "Open"
    commands:
      - tapOn: "Open"
- waitForAnimationToEnd:
    timeout: 15000
- takeScreenshot: 04-plan

- openLink: joyoarto://import
- runFlow:
    when:
      visible: "Open"
    commands:
      - tapOn: "Open"
- waitForAnimationToEnd:
    timeout: 15000
- takeScreenshot: 05-import

# Quick add: the centre tab button opens the add sheet.
- openLink: joyoarto://
- runFlow:
    when:
      visible: "Open"
    commands:
      - tapOn: "Open"
- extendedWaitUntil:
    visible: "Transactions"
    timeout: 30000
- tapOn:
    point: "50%,94%"
# "kopi 25rb gopay" in the field is only a placeholder, which Maestro does not see; wait for the label above it.
- extendedWaitUntil:
    visible: "Or type it"
    timeout: 15000
- tapOn:
    below: "Or type it"
    index: 0
# A fresh simulator shows the keyboard's slide-to-type tip over the sheet the first time; dismiss it.
- runFlow:
    when:
      visible: "Speed up your typing.*"
    commands:
      - tapOn:
          text: "Continue"
          below: "Speed up your typing.*"
- inputText: "kopi 25rb gopay"
- hideKeyboard
- runFlow:
    when:
      visible: "Speed up your typing.*"
    commands:
      - tapOn:
          text: "Continue"
          below: "Speed up your typing.*"
- takeScreenshot: 06-quick-add
