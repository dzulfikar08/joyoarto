plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.joyodigitama.joyoarto.capture'
version = '0.1.0'

android {
  namespace "com.joyodigitama.joyoarto.capture"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
}

dependencies {
  implementation "androidx.core:core-ktx:1.13.1"
  // HeadlessJsTaskService, Arguments: the app supplies the version (React Native Gradle plugin).
  implementation "com.facebook.react:react-android"
}
